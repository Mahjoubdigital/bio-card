<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e3a5f">
<meta name="description" content="Pintor y decorador profesional en Casablanca: pintura de interiores, exteriores y fachadas. Presupuestos gratuitos.">
<title>Zakaria Hamza — Pintor y decorador en Casablanca</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<style>
/* ============ VARIABLES Y BASE ============ */
:root{
  --navy:#0e3a5f; --navy-dark:#0a2c48; --yellow:#f7b500; --yellow-soft:#ffc93c;
  --bg:#f7f8fa; --text:#33475b; --muted:#5b7186; --green:#10b981;
  --radius:10px; --shadow:0 6px 18px rgba(14,58,95,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}

/* ============ BARRA DE IDIOMAS ============ */
.lang-bar{display:flex;justify-content:flex-end;gap:6px;padding:14px 18px 0;max-width:1100px;margin:0 auto}
.lang-btn{padding:2px;border-radius:4px;border:2px solid transparent;transition:.2s;line-height:0}
.lang-btn svg{width:26px;height:18px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.lang-btn:hover{transform:scale(1.1)}
.lang-btn[aria-pressed="true"]{border-color:var(--navy);background:#fff}

/* ============ CONTENEDOR TIPO TARJETA ============ */
.bio{max-width:680px;margin:0 auto;padding:24px 20px 40px}

/* Perfil */
.profile{text-align:center;margin-bottom:26px}
.avatar-ring{width:112px;height:112px;margin:0 auto 16px;border-radius:50%;background:#fff;
  padding:6px;box-shadow:var(--shadow)}
.avatar-ring img,.avatar-fallback{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar-fallback{display:flex;align-items:center;justify-content:center;background:var(--navy);
  color:var(--yellow);font-size:38px;font-weight:800}
.profile h1{color:var(--navy);font-size:28px;font-weight:800;letter-spacing:.2px}
.tagline{color:var(--navy);font-weight:700;font-size:15px;margin-top:6px}
.desc{color:var(--muted);font-size:15px;max-width:560px;margin:14px auto 0}
.desc strong{color:var(--text)}

/* Acciones rápidas (chat / teléfono / WhatsApp) */
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:26px 0 14px}
.qa{display:flex;align-items:center;justify-content:center;height:56px;background:var(--navy);
  border-radius:var(--radius);color:var(--yellow);transition:.2s;box-shadow:var(--shadow)}
.qa svg{width:26px;height:26px}
.qa:hover{background:var(--navy-dark);transform:translateY(-2px)}

/* Barras de sección (acordeones) */
.acc{margin-bottom:14px}
.acc-btn{width:100%;display:flex;align-items:center;gap:12px;padding:17px 18px;border-radius:var(--radius);
  background:var(--navy);color:#fff;font-weight:600;font-size:15.5px;text-align:start;
  transition:.2s;box-shadow:var(--shadow)}
.acc-btn:hover{background:var(--navy-dark)}
.acc-btn .ico{width:20px;height:20px;flex:none;color:#fff}
.acc-btn .chev{width:18px;height:18px;margin-inline-start:auto;transition:transform .35s;color:var(--yellow-soft)}
.acc-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc-panel{max-height:0;overflow:hidden;transition:max-height .45s ease}
.panel-card{background:#fff;border-radius:12px;padding:22px;margin-top:10px;box-shadow:var(--shadow)}
.panel-card h3{color:var(--navy);font-size:15px;margin:14px 0 8px}
.panel-card h3:first-child{margin-top:0}
.panel-card p{font-size:14.5px;color:var(--muted)}
.panel-card ul{list-style:none;margin-top:4px}
.panel-card li{font-size:14.5px;padding:6px 0 6px 0;padding-inline-start:26px;position:relative;color:var(--text)}
.panel-card li::before{content:"";position:absolute;inset-inline-start:6px;top:12px;width:8px;height:8px;
  border-radius:50%;background:var(--yellow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#eef3f8;color:var(--navy);font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;transition:.3s}
.gallery img:hover{transform:scale(1.03)}

/* Carrusel */
.carousel{position:relative;border-radius:12px;overflow:hidden;margin:18px 0 24px;box-shadow:var(--shadow);
  aspect-ratio:16/9;background:#dde5ec}
.car-track{display:flex;height:100%;transition:transform .5s ease}
.car-track img{width:100%;height:100%;object-fit:cover;flex:none}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
  background:rgba(10,44,72,.45);color:#fff;display:flex;align-items:center;justify-content:center;transition:.2s}
.car-btn:hover{background:rgba(10,44,72,.75)}
.car-btn svg{width:20px;height:20px}
.car-prev{inset-inline-start:10px}.car-next{inset-inline-end:10px}
.car-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.car-dots button{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);transition:.2s;padding:0}
.car-dots button.on{background:var(--yellow);transform:scale(1.25)}

/* Video YouTube (fachada con carga al clic) */
.video{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;margin-bottom:24px;
  box-shadow:var(--shadow);background:var(--navy)}
.video .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.video::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45))}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:68px;height:48px;
  background:#f00;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:.2s;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.play-btn:hover{transform:translate(-50%,-50%) scale(1.08);background:#ff0033}
.play-btn svg{width:20px;height:20px;color:#fff}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .vid-title{position:absolute;top:12px;inset-inline-start:14px;z-index:2;color:#fff;font-weight:700;
  font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* Enlaces sociales */
.links{display:grid;gap:14px;margin-bottom:14px}
.link-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:var(--radius);
  background:var(--navy);color:#fff;font-weight:600;font-size:15px;transition:.2s;box-shadow:var(--shadow)}
.link-btn svg{width:20px;height:20px;flex:none}
.link-btn:hover{background:var(--navy-dark);transform:translateY(-2px)}

/* CTA WhatsApp */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;padding:17px;border-radius:var(--radius);
  background:var(--yellow);color:var(--navy);font-weight:800;font-size:14.5px;letter-spacing:.4px;
  text-transform:uppercase;transition:.2s;box-shadow:0 6px 18px rgba(247,181,0,.35)}
.cta svg{width:22px;height:22px}
.cta:hover{filter:brightness(1.06);transform:translateY(-2px)}

/* Pie */
.divider{height:3px;border:none;background:var(--green);border-radius:3px;margin:30px 0 22px}
footer{color:#8a94a3;font-size:13px}

/* Modal de contacto */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(10,44,72,.55);backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-card h2{color:var(--navy);font-size:19px;margin-bottom:14px}
.modal-card label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.modal-card input,.modal-card textarea{width:100%;border:2px solid #dfe6ee;border-radius:10px;padding:11px 13px;
  font:inherit;color:var(--text);background:#fbfcfe}
.modal-card input:focus,.modal-card textarea:focus{outline:none;border-color:var(--navy)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px;border-radius:10px;font-weight:700;font-size:14.5px;transition:.2s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-dark)}
.btn-ghost{background:#eef3f8;color:var(--muted)}
.btn-ghost:hover{background:#e2eaf2}

/* Toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);z-index:60;background:var(--navy);
  color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;
  transition:.3s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Animación de aparición */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .reveal{opacity:1;transform:none}
}
@media (max-width:480px){
  .profile h1{font-size:24px}
  .quick-actions{gap:10px}
  .gallery{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

/* =====================================================================
   🚀 LÓGICA DE LA APLICACIÓN
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let lang = localStorage.getItem("bioLang") || "es";
const t = k => (I18N[lang] && I18N[lang][k]) ?? I18N.es[k] ?? "";

/* ---------- Idiomas ---------- */
function applyLang(l){
  lang = l;
  localStorage.setItem("bioLang", l);
  document.documentElement.lang = l;
  document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $$("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $$("[data-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.aria)));
  // Listas dinámicas
  $("#servicesList").innerHTML = t("services").map(x => `<li>${x}</li>`).join("");
  $("#commitsList").innerHTML  = t("commits").map(x => `<li>${x}</li>`).join("");
  $("#citiesChips").innerHTML  = t("cities").map(x => `<span class="chip">${x}</span>`).join("");
  // Copyright con año actual
  $$("[data-i18n='copyright']").forEach(el => el.textContent = t("copyright").replace("{year}", new Date().getFullYear()));
  // Estado de las banderas
  $$(".lang-btn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  updateOpenPanels();
}
$$(".lang-btn").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));

/* ---------- Acordeones ---------- */
function updateOpenPanels(){
  $$(".acc-btn[aria-expanded='true']").forEach(btn => {
    const p = document.getElementById(btn.getAttribute("aria-controls"));
    p.style.maxHeight = p.scrollHeight + "px";
  });
}
$$(".acc-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const open = btn.getAttribute("aria-expanded") === "true";
    const p = document.getElementById(btn.getAttribute("aria-controls"));
    btn.setAttribute("aria-expanded", String(!open));
    p.style.maxHeight = open ? "0px" : p.scrollHeight + "px";
  });
});
window.addEventListener("resize", updateOpenPanels);

/* ---------- Carrusel ---------- */
const track = $("#carTrack"), dotsBox = $("#carDots");
let idx = 0, timer = null;
CONFIG.images.forEach((src, i) => {
  track.insertAdjacentHTML("beforeend", `<img src="${src}" alt="${CONFIG.name} ${i+1}" loading="${i? "lazy":"eager"}">`);
  dotsBox.insertAdjacentHTML("beforeend", `<button aria-label="Slide ${i+1}"></button>`);
});
const dots = $$("#carDots button");
function go(i){
  idx = (i + CONFIG.images.length) % CONFIG.images.length;
  track.style.transform = `translateX(-${idx * 100}%)`;
  dots.forEach((d, j) => d.classList.toggle("on", j === idx));
}
function restart(){ clearInterval(timer); timer = setInterval(() => go(idx + 1), 5000); }
$("#carPrev").addEventListener("click", () => { go(idx - 1); restart(); });
$("#carNext").addEventListener("click", () => { go(idx + 1); restart(); });
dots.forEach((d, j) => d.addEventListener("click", () => { go(j); restart(); }));
// Swipe táctil
let x0 = null;
$("#carousel").addEventListener("pointerdown", e => x0 = e.clientX);
$("#carousel").addEventListener("pointerup", e => {
  if (x0 === null) return;
  const dx = e.clientX - x0;
  if (Math.abs(dx) > 40) { go(idx + (dx < 0 ? 1 : -1)); restart(); }
  x0 = null;
});
go(0); restart();

/* ---------- Galería Inspiración ---------- */
$("#gallery").innerHTML = CONFIG.gallery.map((src, i) => `<img src="${src}" alt="Inspiration ${i+1}" loading="lazy">`).join("");

/* ---------- Video YouTube (fachada → iframe al clic) ---------- */
(function buildVideo(){
  const box = $("#videoBox");
  const poster = CONFIG.videoId
    ? `https://i.ytimg.com/vi/${CONFIG.videoId}/hqdefault.jpg`
    : "https://images.unsplash.com/photo-1562259949-e8e7689d7828?auto=format&fit=crop&w=1200&q=70";
  box.innerHTML = `
    <img class="thumb" src="${poster}" alt="Video">
    <span class="vid-title">${CONFIG.name}</span>
    <button class="play-btn" aria-label="Play">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>`;
  box.querySelector(".play-btn").addEventListener("click", () => {
    if (!CONFIG.videoId) return toast(t("toast_video"));
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${CONFIG.videoId}?autoplay=1&rel=0"
      title="YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen loading="lazy"></iframe>`;
  });
})();

/* ---------- Enlaces y contactos ---------- */
$("#btnCall").href = `tel:${CONFIG.phone.replace(/\s/g, "")}`;
$("#btnWa").href = $("#ctaWa").href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("Hola " + CONFIG.name + ", me gustaría pedir un presupuesto.")}`;
$("#linkWeb").href = CONFIG.links.web;
$("#linkIg").href  = CONFIG.links.instagram;
$("#linkYt").href  = CONFIG.links.youtube;
$("#linkFb").href  = CONFIG.links.facebook;
$("#linkTt").href  = CONFIG.links.tiktok;

/* ---------- Modal de contacto → WhatsApp ---------- */
const modal = $("#chatModal");
$("#btnChat").addEventListener("click", () => { modal.hidden = false; $("#fName").focus(); });
$("#modalCancel").addEventListener("click", () => modal.hidden = true);
modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") modal.hidden = true; });
$("#chatForm").addEventListener("submit", e => {
  e.preventDefault();
  const txt = `Hola, soy ${$("#fName").value.trim()}. ${$("#fMsg").value.trim()}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`, "_blank");
  modal.hidden = true; e.target.reset(); toast(t("toast_sent"));
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ---------- Avatar con respaldo ---------- */
$("#avatar").src = CONFIG.avatar;
$("#avatar").addEventListener("error", function(){
  const initials = CONFIG.name.split(" ").map(w => w[0]).slice(0, 2).join("");
  this.outerHTML = `<div class="avatar-fallback">${initials}</div>`;
});

/* ---------- Animación de aparición ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
}), { threshold: .12 });
$$(".reveal").forEach(el => io.observe(el));

/* ---------- Inicio ---------- */
applyLang(lang);
</script>
