<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e3a5f">
<meta name="description" content="Pintor y decorador profesional en Casablanca">
<title>Zakaria Hamza — Pintor y decorador</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">

<body>

<!-- Selector de idioma -->
<div class="lang-bar" role="group" aria-label="Idioma">

    <svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#C1272D"/><path d="M30 8 37.06 29.71 18.59 16.29 41.41 16.29 22.94 29.71 Z" fill="none" stroke="#006233" stroke-width="2"/></svg>
  </button>
  <button class="lang-btn" data-lang="fr" aria-label="Français">
    <svg viewBox="0 0 60 40"><rect width="20" height="40" fill="#0055A4"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#EF4135"/></svg>
  </button>
  <button class="lang-btn" data-lang="es" aria-label="Español">
    <svg viewBox="0 0 60 40"><rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/></svg>
  </button>
</div>

    <p class="tagline" data-i18n="tagline"></p>
    <p class="desc" data-i18n-html="desc"></p>
  </header>

  <div class="quick-actions reveal">

  <section class="acc reveal">
    <button class="acc-btn" aria-expanded="false" aria-controls="panelAbout">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="about_title"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="acc-panel" id="panelAbout">
      <div class="panel-card">
        <h3 data-i18n="about_intro"></h3>
        <p data-i18n="about_p"></p>
        <h3 data-i18n="services_title"></h3>
        <ul id="servicesList"></ul>
        <h3 data-i18n="commits_title"></h3>
        <ul id="commitsList"></ul>
      </div>
    </div>
  </section>

  <figure class="carousel reveal" id="carousel" dir="ltr">
    <div class="car-track" id="carTrack"></div>
    <button class="car-btn car-prev" id="carPrev" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="car-btn car-next" id="carNext" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="car-dots" id="carDots"></div>
  </figure>

  <section class="acc reveal">
    <button class="acc-btn" aria-expanded="false" aria-controls="panelArea">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="area_title"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="acc-panel" id="panelArea">
      <div class="panel-card">
        <p data-i18n="area_intro"></p>
        <div class="chips" id="citiesChips"></div>
      </div>
    </div>
  </section>

  <section class="acc reveal">
    <button class="acc-btn" aria-expanded="false" aria-controls="panelInsp">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-i18n="insp_title"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="acc-panel" id="panelInsp">
      <div class="panel-card">
        <p data-i18n="insp_text"></p>
        <div class="gallery" id="gallery"></div>
      </div>
    </div>
  </section>

  <div class="video reveal" id="videoBox"></div>

  <nav class="links reveal">
    <a class="link-btn" id="linkWeb" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>

      <span data-i18n="link_ig"></span></a>
    <a class="link-btn" id="linkYt" href="#" target="_blank" rel="noopener">

      <span data-i18n="link_yt"></span></a>
    <a class="link-btn" id="linkFb" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>

  <hr class="divider">
  <footer><span data-i18n="copyright"></span></footer>
</main>

<div class="modal" id="chatModal" hidden role="dialog" aria-modal="true">
  <div class="modal-card">
    <h2 data-i18n="modal_title"></h2>
    <form id="chatForm">
      <label for="fName" data-i18n="modal_name"></label>
      <input id="fName" required maxlength="60">
      <label for="fMsg" data-i18n="modal_msg"></label>
      <textarea id="fMsg" rows="4" required maxlength="500"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modalCancel" data-i18n="modal_cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="modal_send"></button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
